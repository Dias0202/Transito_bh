[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bhtraffic"
version = "0.1.0"
description = "Belo Horizonte (BR) traffic diagnosis and ML/AI solutions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Core deps only. The collector (bhtraffic.collect) is stdlib-only on purpose,
# so the GitHub Actions job runs without installing anything.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "requests>=2.31",
]

[project.optional-dependencies]
geo = ["h3>=4.1", "pyproj>=3.6", "shapely>=2.0", "geopandas>=0.14", "osmnx>=1.9"]
viz = ["matplotlib>=3.8", "plotly>=5.18"]
ml = ["lightgbm>=4.3", "shap>=0.45", "torch>=2.2", "torch-geometric>=2.5"]
sim = ["eclipse-sumo>=1.20", "sumo-rl>=1.4", "stable-baselines3>=2.3"]
dev = ["pytest>=8", "nbformat>=5", "nbconvert>=7", "ipykernel>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

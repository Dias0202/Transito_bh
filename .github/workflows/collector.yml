name: collector

# Budget: private repos get 2,000 Actions minutes/month and every job is
# billed rounded UP to a whole minute (skipped runs included), so the
# schedules below never overlap. ~1,250 runs/month -> fits only if each job
# stays under 60 s. Minutes avoid :00 because GitHub delays/drops cron jobs
# at the top of the hour. Times are UTC (BRT = UTC-3).
on:
  schedule:
    - cron: "7,22,37,52 9-12,19-22 * * 1-5"   # weekday peaks: 06-10h and 16-20h BRT, every 15 min
    - cron: "37 0-8,13-18,23 * * 1-5"         # weekday off-peak: hourly
    - cron: "37 * * * 0,6"                     # weekends: hourly
  workflow_dispatch:

concurrency:
  group: collector
  cancel-in-progress: false

permissions:
  contents: read

# rclone reads every RCLONE_* env var as a flag (RCLONE_VERSION -> --version),
# so workflow-level names avoid that prefix.
env:
  PIN_RCLONE_VERSION: v1.68.2
  DRIVE_DEST: gdrive:transito_bh/raw/collector

jobs:
  collect:
    # Scheduled runs stay off until the repo variable COLLECTOR_ENABLED=true is set
    # (after secrets exist and a manual run succeeded). A job skipped here gets no
    # runner, so it is not billed. Manual dispatch always runs.
    if: github.event_name == 'workflow_dispatch' || vars.COLLECTOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /data/corridors.toml

      - name: Restore rclone binary
        id: rclone-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/rclone
          key: rclone-${{ env.PIN_RCLONE_VERSION }}

      - name: Install rclone
        if: steps.rclone-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -sSL "https://downloads.rclone.org/${PIN_RCLONE_VERSION}/rclone-${PIN_RCLONE_VERSION}-linux-amd64.zip" -o /tmp/rclone.zip
          unzip -q -j /tmp/rclone.zip '*/rclone' -d ~/.local/bin

      # Runner's system python3 (3.12) is enough: the collector is stdlib-only.
      - name: Collect snapshot
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          HERE_API_KEY: ${{ secrets.HERE_API_KEY }}
          PYTHONPATH: src
        run: python3 -m bhtraffic.collect.run --out out

      # Fails the job loudly (GitHub e-mails on failure) if Drive auth breaks,
      # e.g. an expired OAuth refresh token. See docs/setup_rclone.md.
      - name: Upload to Google Drive
        env:
          DRIVE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          test -n "$DRIVE_CONF" || { echo "::error::RCLONE_CONF secret missing"; exit 1; }
          printf '%s' "$DRIVE_CONF" > /tmp/rclone.conf
          ~/.local/bin/rclone --config /tmp/rclone.conf copy out "$DRIVE_DEST" --no-traverse --retries 3
          rm -f /tmp/rclone.conf
